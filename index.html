<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>今天做什么 · 命运轮盘</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
:root{
  --bg:#0a0e27;
  --text:#e8e6ff;--dim:rgba(232,230,255,.5);
  --panel:rgba(20,25,60,.75);--border:rgba(120,100,255,.3);
  --accent:#7c5cff;--accent2:#5cffea;
  --glow:0 0 30px rgba(124,92,255,.4);
  --font-head:'Georgia',serif;
  --font-body:system-ui,-apple-system,sans-serif;
}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
  transition:background .7s ease,color .5s;
  position:relative;
}
body::before{
  content:'';position:fixed;inset:0;
  background:radial-gradient(circle at 30% 20%,rgba(124,92,255,.12),transparent 60%),
             radial-gradient(circle at 80% 70%,rgba(92,255,234,.08),transparent 50%);
  pointer-events:none;z-index:0;
  animation:breathe 8s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.6}50%{opacity:1}}
.hidden{display:none!important}
#particles{position:fixed;inset:0;pointer-events:none;z-index:1}
#stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(16px,4vh,28px);padding:20px;position:relative;z-index:2}
h1{font-family:var(--font-head);font-size:clamp(26px,6vw,38px);font-weight:700;letter-spacing:.2em;text-shadow:var(--glow);text-align:center;transition:all .5s;position:relative}
h1::after{content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:60px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.6}
#hint{color:var(--dim);font-size:clamp(12px,3vw,14px);letter-spacing:.15em;min-height:18px;text-align:center;transition:color .4s}
#wheelWrap{position:relative;width:min(82vw,420px);aspect-ratio:1;filter:drop-shadow(0 10px 40px rgba(0,0,0,.3))}
#wheel{width:100%;height:100%;display:block;cursor:pointer;transition:filter .3s}
#wheel:hover{filter:brightness(1.08)}
#card{
  position:absolute;inset:10%;z-index:5;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,3vh,20px);
  background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1.5px solid var(--border);border-radius:30px;
  box-shadow:0 20px 60px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1);
  animation:cardPop .5s cubic-bezier(.2,1.2,.3,1);padding:clamp(16px,4vw,24px);
}
@keyframes cardPop{from{opacity:0;transform:scale(.75) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.card-tag{font-size:10px;letter-spacing:.35em;color:var(--dim);text-transform:uppercase}
#cardTitle{font-family:var(--font-head);font-size:clamp(20px,5vw,32px);font-weight:800;letter-spacing:.08em;text-align:center;color:var(--accent2);text-shadow:var(--glow);line-height:1.3}
#cardActions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px}
.btn{
  border:none;cursor:pointer;border-radius:50px;
  padding:14px 28px;font-size:clamp(14px,3.5vw,16px);font-weight:600;letter-spacing:.12em;
  color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 6px 20px rgba(0,0,0,.3);
  transition:all .2s;position:relative;overflow:hidden;
}
.btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.3),transparent);
  opacity:0;transition:opacity .3s;
}
.btn:hover::before{opacity:1}
.btn:active{transform:scale(.96)}
.btn.ghost{
  background:transparent;color:var(--text);
  border:1.5px solid var(--border);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 15px rgba(0,0,0,.2);
}
#flash{
  position:absolute;inset:0;z-index:4;
  display:flex;align-items:center;justify-content:center;
  background:var(--panel);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border-radius:50%;opacity:0;pointer-events:none;
  transition:opacity .4s;
}
#flash.show{opacity:1;animation:flashPulse .6s ease-out}
@keyframes flashPulse{0%{transform:scale(.85)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
#flashText{font-size:clamp(28px,8vw,50px);font-weight:900;color:var(--accent2);letter-spacing:.12em;text-shadow:var(--glow)}
#gear{
  position:fixed;top:max(env(safe-area-inset-top),12px);right:16px;z-index:50;
  width:48px;height:48px;border-radius:50%;
  border:1.5px solid var(--border);background:var(--panel);
  backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
  color:var(--text);font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .3s,box-shadow .3s;
  box-shadow:0 4px 16px rgba(0,0,0,.25);
}
#gear:hover{box-shadow:0 6px 24px rgba(0,0,0,.35)}
#gear:active{transform:rotate(90deg) scale(.92)}
#settings{
  position:fixed;inset:0;z-index:60;
  background:rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;transition:opacity .4s;
  display:flex;justify-content:flex-end;
}
#settings.open{opacity:1;pointer-events:auto}
#settings .panel{
  width:min(85vw,360px);height:100%;
  background:var(--panel);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);
  border-left:1.5px solid var(--border);
  padding:max(env(safe-area-inset-top),20px) 22px 22px;
  transform:translateX(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);
  overflow-y:auto;
}
#settings.open .panel{transform:none}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.panel-head span{font-family:var(--font-head);font-size:22px;font-weight:700;letter-spacing:.25em}
.x{border:none;background:none;color:var(--dim);font-size:24px;cursor:pointer;padding:6px;transition:color .2s}
.x:hover{color:var(--text)}
.sec{font-size:11px;letter-spacing:.3em;color:var(--dim);margin:20px 0 12px;text-transform:uppercase}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.theme-item{
  border:1.5px solid var(--border);border-radius:18px;
  padding:12px;cursor:pointer;background:var(--panel);
  text-align:center;transition:all .2s;
}
.theme-item:active{transform:scale(.96)}
.theme-item .sw{height:60px;border-radius:12px;margin-bottom:10px;border:1px solid rgba(255,255,255,.12);overflow:hidden;position:relative}
.theme-item .nm{font-size:13px;color:var(--text);letter-spacing:.06em;font-weight:500}
.theme-item.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent2),0 8px 20px rgba(0,0,0,.3)}
#taskView{
  position:fixed;inset:0;z-index:40;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;background:var(--bg);cursor:pointer;text-align:center;padding:24px;
}
#check{
  font-size:clamp(50px,15vw,90px);color:var(--accent2);
  opacity:0;transform:scale(.2);
  transition:all .6s cubic-bezier(.2,1.3,.3,1);
  text-shadow:0 0 40px currentColor;
}
#taskView.done #check{opacity:1;transform:scale(1) rotate(5deg)}
#taskName{
  font-family:var(--font-head);font-size:clamp(30px,8vw,56px);
  font-weight:800;letter-spacing:.12em;color:var(--text);
  transition:all .6s;line-height:1.2;
}
#taskView.done #taskName{color:var(--accent2);transform:scale(1.06);text-shadow:var(--glow)}
#taskMeta{font-size:clamp(15px,4vw,24px);color:var(--dim);letter-spacing:.16em;font-weight:500}
#taskHint{font-size:13px;color:var(--dim);letter-spacing:.25em;margin-top:28px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
</style>
</head>
<body>

<canvas id="particles"></canvas>
<button id="gear" aria-label="设置">⚙</button>

<div id="settings">
  <div class="panel">
    <div class="panel-head"><span>设 置</span><button id="closeSettings" class="x">✕</button></div>
    <div class="sec">主题风格</div>
    <div class="theme-grid" id="themeGrid"></div>
  </div>
</div>

<main id="stage">
  <h1 id="headline">今天做什么？</h1>
  <div id="wheelWrap">
    <canvas id="wheel"></canvas>
    <div id="card" class="hidden">
      <div class="card-tag" id="cardTag">命运的决定</div>
      <div id="cardTitle"></div>
      <div id="cardActions"></div>
    </div>
    <div id="flash"><span id="flashText"></span></div>
  </div>
  <p id="hint">点击转盘，开始转动</p>
</main>

<section id="taskView" class="hidden">
  <div id="check">✓</div>
  <h2 id="taskName"></h2>
  <p id="taskMeta"></p>
  <p id="taskHint">点击完成</p>
</section>

<script>
(function(){
'use strict';

var ACTIVITIES=[
  {name:'学习 HTML',bg:null},
  {name:'看硬核知识',bg:null},
  {name:'看电影 / 动漫解说',bg:null},
  {name:'画画',bg:['听歌','听视频','安静画']},
  {name:'数字油画 / 手工',bg:['听歌','听视频','安静做']},
  {name:'出门溜达',bg:['听歌','听书','安静走']},
  {name:'做家务',bg:['听歌','听书','听视频','安静做']},
  {name:'出门夜跑',bg:['听歌','安静跑']},
  {name:'出门购物',bg:['听歌','安静逛']},
  {name:'和 ChatGPT 聊项目书',bg:null},
  {name:'找 AI 研究 OC',bg:null},
  {name:'写小说',bg:null}
];
var TIMES=['15分钟','30分钟','45分钟','1小时','1.5小时','2小时'];

var THEMES={
  cyber:{
    name:'赛博夜色',
    bg:'#0a0e27',
    text:'#e8e6ff',dim:'rgba(232,230,255,.5)',
    panel:'rgba(20,25,60,.75)',border:'rgba(120,100,255,.3)',
    accent:'#7c5cff',accent2:'#5cffea',
    glow:'0 0 30px rgba(124,92,255,.4)',
    fontHead:'Georgia,serif',fontBody:'system-ui,sans-serif',
    wheel:['#ff2a6d','#05d9e8','#7c5cff','#ffd60a','#01cdfe','#ff3e9d','#b967ff','#00e5ff','#ffb800','#ff006e','#7b2cbf','#06ffa5'],
    centerBg:'rgba(10,14,39,.85)',centerBorder:'#7c5cff',
    pointer:'#5cffea',pointerGlow:'0 0 18px #5cffea'
  },
  sunset:{
    name:'日落余晖',
    bg:'linear-gradient(160deg,#2d1b3d 0%,#4a2c3e 40%,#7a3e36 100%)',
    text:'#ffe9d6',dim:'rgba(255,233,214,.55)',
    panel:'rgba(60,30,40,.7)',border:'rgba(255,150,100,.35)',
    accent:'#ff6b35',accent2:'#f7b32b',
    glow:'0 0 26px rgba(255,107,53,.45)',
    fontHead:'Georgia,serif',fontBody:'system-ui,sans-serif',
    wheel:['#ff6b35','#f7b32b','#e63946','#ff8c42','#d4a373','#c9485b','#ff9f68','#ffd23f','#f26a4f','#ffbe0b','#c1666b','#e8a87c'],
    centerBg:'rgba(45,27,61,.9)',centerBorder:'#ff6b35',
    pointer:'#f7b32b',pointerGlow:'0 0 16px #f7b32b'
  },
  forest:{
    name:'森林秘境',
    bg:'linear-gradient(170deg,#0d1f18 0%,#1a3528 60%,#0f2620 100%)',
    text:'#e8f5e9',dim:'rgba(232,245,233,.5)',
    panel:'rgba(20,40,30,.7)',border:'rgba(120,180,140,.3)',
    accent:'#66bb6a',accent2:'#a5d6a7',
    glow:'0 0 24px rgba(102,187,106,.35)',
    fontHead:'Georgia,serif',fontBody:'system-ui,sans-serif',
    wheel:['#2e7d32','#388e3c','#43a047','#66bb6a','#81c784','#4caf50','#558b2f','#689f38','#7cb342','#8bc34a','#9ccc65','#aed581'],
    centerBg:'rgba(13,31,24,.9)',centerBorder:'#66bb6a',
    pointer:'#a5d6a7',pointerGlow:'0 0 14px #a5d6a7'
  },
  cream:{
    name:'奶油梦境',
    bg:'linear-gradient(180deg,#fef6e4 0%,#f3d2c1 50%,#f8edeb 100%)',
    text:'#3d2e2e',dim:'rgba(61,46,46,.5)',
    panel:'rgba(255,250,240,.75)',border:'rgba(200,150,130,.35)',
    accent:'#d4a373',accent2:'#e07a5f',
    glow:'none',
    fontHead:'Georgia,serif',fontBody:'system-ui,sans-serif',
    wheel:['#f4a261','#e76f51','#e9c46a','#f4a261','#e07a5f','#d4a373','#ffb5a7','#fcd5ce','#f8ad9d','#f4978e','#f08080','#e9b5a0'],
    centerBg:'rgba(254,246,228,.9)',centerBorder:'#d4a373',
    pointer:'#e07a5f',pointerGlow:'none'
  }
};
var themeKeys=Object.keys(THEMES);

var currentTheme='cyber',stage='idle',rotation=0,spinning=false,spinRound=0,picked=null,items=ACTIVITIES,centerLabel='开转';

function $(id){return document.getElementById(id);}
var headline=$('headline'),hint=$('hint'),wheelWrap=$('wheelWrap'),canvas=$('wheel'),
    card=$('card'),cardTag=$('cardTag'),cardTitle=$('cardTitle'),cardActions=$('cardActions'),
    flash=$('flash'),flashText=$('flashText'),gear=$('gear'),settings=$('settings'),
    closeSettings=$('closeSettings'),themeGrid=$('themeGrid'),
    taskView=$('taskView'),taskName=$('taskName'),taskMeta=$('taskMeta'),check=$('check');

function setHeadline(t){headline.textContent=t;}
function setHint(t){hint.textContent=t;}
function showCard(){card.classList.remove('hidden');}
function hideCard(){card.classList.add('hidden');}
function showFlash(t){flashText.textContent=t;flash.classList.add('show');setTimeout(function(){flash.classList.remove('show');},1500);}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}

function applyTheme(k,save){
  var t=THEMES[k];currentTheme=k;
  var s=document.documentElement.style;
  if(t.bg.includes('gradient')){document.body.style.background=t.bg;}
  else{document.body.style.backgroundColor=t.bg;}
  s.setProperty('--bg',t.bg);
  s.setProperty('--text',t.text);s.setProperty('--dim',t.dim);
  s.setProperty('--panel',t.panel);s.setProperty('--border',t.border);
  s.setProperty('--accent',t.accent);s.setProperty('--accent2',t.accent2);
  s.setProperty('--glow',t.glow||'none');
  s.setProperty('--font-head',t.fontHead);s.setProperty('--font-body',t.fontBody);
  if(save){try{localStorage.setItem('wheel-theme',k);}catch(e){}}
  updateThemeGrid();drawWheel();initParticles();
}
function buildThemeGrid(){
  themeGrid.innerHTML='';
  themeKeys.forEach(function(k){
    var t=THEMES[k],item=document.createElement('div');
    item.className='theme-item';item.dataset.key=k;
    var bg=t.bg.includes('gradient')?t.bg:t.bg;
    item.innerHTML='<div class="sw" style="background:'+bg+'"></div><div class="nm">'+t.name+'</div>';
    item.addEventListener('click',function(){applyTheme(k,true);});
    themeGrid.appendChild(item);
  });
}
function updateThemeGrid(){
  themeGrid.querySelectorAll('.theme-item').forEach(function(el){
    el.classList.toggle('on',el.dataset.key===currentTheme);
  });
}

function drawWheel(){
  var w=wheelWrap.clientWidth,dpr=window.devicePixelRatio||1;
  canvas.width=w*dpr;canvas.height=w*dpr;
  var ctx=canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var cx=w/2,cy=w/2,R=w/2-6,n=items.length,step=Math.PI*2/n,t=THEMES[currentTheme];
  ctx.clearRect(0,0,w,w);
  for(var i=0;i<n;i++){
    var s=rotation+i*step,e=s+step;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,s,e);ctx.closePath();
    ctx.fillStyle=t.wheel[i%t.wheel.length];ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.15)';ctx.lineWidth=1.2;ctx.stroke();
    var mid=s+step/2;
    var txt=typeof items[i]==='string'?items[i]:items[i].name;
    var chars=txt.replace(/\s/g,'').split('');
    var fs=Math.min(R*.13,R*.55/Math.max(chars.length,1));fs=Math.max(fs,9);
    ctx.save();ctx.translate(cx,cy);ctx.rotate(mid);
    ctx.font='700 '+fs+'px '+t.fontBody;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#fff';ctx.strokeStyle='rgba(0,0,0,.35)';
    ctx.lineWidth=Math.max(2.5,fs*.15);ctx.lineJoin='round';
    var r0=R*.32;
    for(var j=0;j<chars.length;j++){
      var x=r0+j*fs*1.08;
      ctx.strokeText(chars[j],x,0);ctx.fillText(chars[j],x,0);
    }
    ctx.restore();
  }
  ctx.beginPath();ctx.arc(cx,cy,R*.24,0,Math.PI*2);
  ctx.fillStyle=t.centerBg;ctx.fill();
  ctx.strokeStyle=t.centerBorder;ctx.lineWidth=2.5;ctx.stroke();
  if(centerLabel){
    ctx.fillStyle=t.accent2;ctx.font='800 '+Math.round(R*.1)+'px '+t.fontBody;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(centerLabel,cx,cy);
  }
  ctx.save();
  ctx.shadowColor=t.pointer;ctx.shadowBlur=12;
  ctx.beginPath();ctx.moveTo(cx,4);ctx.lineTo(cx-12,26);ctx.lineTo(cx+12,26);ctx.closePath();
  ctx.fillStyle=t.pointer;ctx.fill();
  ctx.restore();
}

function spinTo(targetIndex,list,onDone){
  if(spinning)return;spinning=true;
  var n=list.length,step=Math.PI*2/n,tau=Math.PI*2;
  var cur=((rotation%tau)+tau)%tau;
  var delta=(-Math.PI/2-(targetIndex+.5)*step-cur);
  delta=((delta%tau)+tau)%tau;
  var total=delta+(5+Math.random()*2)*tau;
  var start=rotation,dur=3800+Math.random()*800,t0=performance.now();
  function frame(now){
    var p=Math.min((now-t0)/dur,1),e=1-Math.pow(1-p,4);
    rotation=start+total*e;
    drawWheel();
    if(p<1)requestAnimationFrame(frame);
    else{spinning=false;onDone(targetIndex);}
  }
  requestAnimationFrame(frame);
}

function startMainSpin(){
  if(spinning)return;
  stage='mainSpin';items=ACTIVITIES;centerLabel='…';hideCard();
  setHeadline('命运转动中…');setHint('转盘转起来啦');
  var idx=Math.floor(Math.random()*ACTIVITIES.length);
  spinTo(idx,ACTIVITIES,function(i){
    spinRound++;var landed=ACTIVITIES[i];
    if(spinRound>=3)showThree(landed);else showMainResult(landed);
  });
}
function showMainResult(a){
  stage='mainResult';centerLabel='';var left=3-spinRound;
  setHeadline('转到啦！');setHint(left>0?'不满意可以再转 '+left+' 次':'就它了');
  cardTag.textContent='命运的决定';cardTitle.textContent=a.name;cardActions.innerHTML='';
  var ok=document.createElement('button');ok.className='btn';ok.textContent='就它了 ✓';
  ok.addEventListener('click',function(){startTimeSpin(a);});
  cardActions.appendChild(ok);
  if(left>0){
    var ag=document.createElement('button');ag.className='btn ghost';ag.textContent='再转一次（剩 '+left+' 次）';
    ag.addEventListener('click',startMainSpin);cardActions.appendChild(ag);
  }
  showCard();
}
function showThree(landed){
  stage='three';centerLabel='';setHeadline('必须三选一');setHint('命运已锁定');
  cardTag.textContent='三选一';cardTitle.textContent='就选一个吧';cardActions.innerHTML='';
  var others=ACTIVITIES.filter(function(x){return x.name!==landed.name;});shuffle(others);
  var choices=shuffle([landed,others[0],others[1]]);
  choices.forEach(function(a){
    var b=document.createElement('button');b.className='btn ghost';b.textContent=a.name;
    b.addEventListener('click',function(){startTimeSpin(a);});cardActions.appendChild(b);
  });
  showCard();
}
function startTimeSpin(a){
  picked={activity:a,time:null,bg:null};stage='timeSpin';items=TIMES;centerLabel='…';hideCard();
  setHeadline('做多久？');setHint('时间交给命运');
  var idx=Math.floor(Math.random()*TIMES.length);
  spinTo(idx,TIMES,function(i){
    picked.time=TIMES[i];showFlash(TIMES[i]);
    setTimeout(function(){
      if(picked.activity.bg&&picked.activity.bg.length)startBgSpin();else goTask();
    },1600);
  });
}
function startBgSpin(){
  stage='bgSpin';centerLabel='…';var opts=picked.activity.bg;items=opts;
  setHeadline('配点什么？');setHint('背景声音交给命运');
  var idx=Math.floor(Math.random()*opts.length);
  spinTo(idx,opts,function(i){
    picked.bg=opts[i];showFlash(opts[i]);setTimeout(goTask,1600);
  });
}
function goTask(){
  stage='task';taskName.textContent=picked.activity.name;
  var parts=[picked.time];if(picked.bg)parts.push(picked.bg);
  taskMeta.textContent=parts.join(' · ');
  taskView.classList.remove('hidden');taskView.classList.remove('done');
  setHeadline('去完成吧');setHint('做完记得回来点一下');
}
function completeTask(){
  if(stage!=='task')return;stage='done';taskView.classList.add('done');
  setTimeout(resetAll,2000);
}
function resetAll(){
  stage='idle';spinRound=0;picked=null;items=ACTIVITIES;centerLabel='开转';
  taskView.classList.add('hidden');hideCard();
  setHeadline('今天做什么？');setHint('点击转盘，开始转动');drawWheel();
}

canvas.addEventListener('click',function(){if(stage==='idle')startMainSpin();});
gear.addEventListener('click',function(){settings.classList.add('open');});
function closeSetting(){settings.classList.remove('open');}
closeSettings.addEventListener('click',closeSetting);
settings.addEventListener('click',function(e){if(e.target===settings)closeSetting();});
taskView.addEventListener('click',completeTask);
window.addEventListener('resize',function(){if(!spinning)drawWheel();});

var particles=[];
function initParticles(){
  var pc=$('particles'),t=THEMES[currentTheme];
  pc.width=window.innerWidth;pc.height=window.innerHeight;
  var ctx=pc.getContext('2d');
  particles=[];
  for(var i=0;i<(currentTheme==='cream'?25:40);i++){
    particles.push({
      x:Math.random()*pc.width,y:Math.random()*pc.height,
      vx:(Math.random()-.5)*.4,vy:Math.random()*.5+.2,
      r:Math.random()*2.5+.8,
      color:currentTheme==='cyber'?'rgba(124,92,255,'+(Math.random()*.3+.15)+')':
            currentTheme==='sunset'?'rgba(255,107,53,'+(Math.random()*.25+.1)+')':
            currentTheme==='forest'?'rgba(102,187,106,'+(Math.random()*.2+.1)+')':
            'rgba(212,163,115,'+(Math.random()*.15+.08)+')'
    });
  }
  function animate(){
    ctx.clearRect(0,0,pc.width,pc.height);
    particles.forEach(function(p){
      p.x+=p.vx;p.y+=p.vy;
      if(p.y>pc.height+10){p.y=-10;p.x=Math.random()*pc.width;}
      if(p.x<-10||p.x>pc.width+10)p.vx*=-1;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.color;ctx.fill();
    });
    requestAnimationFrame(animate);
  }
  animate();
}

try{currentTheme=localStorage.getItem('wheel-theme')||'cyber';if(!THEMES[currentTheme])currentTheme='cyber';}catch(e){}
buildThemeGrid();applyTheme(currentTheme,false);
})();
</script>
