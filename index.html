<!-- 先放上次用的主题的样式，打开时不会闪一下；换主题时会被替换 -->
<script>
  (function () {
    var id = 'tarot';
    try { id = localStorage.getItem('td-theme') || id; } catch (e) {}
    if (!/^[a-z0-9-]+$/.test(id)) id = 'tarot';
    document.write('<link rel="stylesheet" id="theme-css" href="themes/' + id + '/style.css">');
  })();
</script>
