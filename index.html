<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>今天做什么?</title>
<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="轮盘">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" type="image/svg+xml" href="./icon.svg">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:background .5s,color .5s}
.hidden{display:none!important}

/* 主题变量会被 JS 动态设置 */
:root{
  --bg:#fff;--text:#000;--dim:rgba(0,0,0,.5);
  --panel:rgba(255,255,255,.9);--border:#ccc;
  --accent:#ff0066;--accent2:#00ffcc;
}

#stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,3vh,24px);padding:20px;background:var(--bg);color:var(--text);transition:all .5s}
h1{font-size:clamp(22px,5vw,36px);font-weight:700;text-align:center;transition:all .4s;margin-bottom:8px}
#hint{font-size:clamp(11px,2.5vw,14px);color:var(--dim);text-align:center;min-height:18px;transition:all .4s}

#wheelWrap{position:relative;width:min(80vw,380px);aspect-ratio:1;margin:12px 0}
#wheel{width:100%;height:100%;display:block;cursor:pointer;transition:filter .3s}
#wheel:hover{filter:brightness(1.05)}

#pointer{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:20px solid var(--accent);z-index:10;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}

#card{
  position:absolute;inset:12%;z-index:5;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(10px,2.5vh,18px);
  background:var(--panel);border:2px solid var(--border);
  box-shadow:0 10px 40px rgba(0,0,0,.25);
  padding:clamp(14px,4vw,22px);
  animation:cardIn .4s cubic-bezier(.2,1.1,.3,1);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
@keyframes cardIn{from{opacity:0;transform:scale(.85) translateY(15px)}to{opacity:1;transform:scale(1) translateY(0)}}

#cardTag{font-size:9px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
#cardTitle{font-size:clamp(18px,4.5vw,28px);font-weight:700;text-align:center;color:var(--accent);line-height:1.3;padding:0 8px}
#cardActions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:260px}

.btn{
  border:none;cursor:pointer;padding:12px 24px;
  font-size:clamp(13px,3vw,15px);font-weight:600;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;border-radius:6px;
  box-shadow:0 4px 12px rgba(0,0,0,.2);
  transition:all .2s;width:100%;
}
.btn:active{transform:scale(.96)}
.btn.ghost{
  background:transparent;color:var(--text);
  border:1.5px solid var(--border);
  box-shadow:0 2px 8px rgba(0,0,0,.1);
}

#flash{
  position:absolute;inset:0;z-index:4;
  display:flex;align-items:center;justify-content:center;
  background:var(--panel);border-radius:50%;
  opacity:0;pointer-events:none;transition:opacity .35s;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
#flash.show{opacity:1;animation:flashPulse .5s ease-out}
@keyframes flashPulse{0%{transform:scale(.9)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
#flashText{font-size:clamp(24px,7vw,44px);font-weight:900;color:var(--accent);text-shadow:0 0 20px currentColor}

#gear{
  position:fixed;top:max(env(safe-area-inset-top),12px);right:14px;z-index:50;
  width:44px;height:44px;border-radius:50%;
  border:1.5px solid var(--border);background:var(--panel);
  color:var(--text);font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .3s,box-shadow .3s;
  box-shadow:0 2px 12px rgba(0,0,0,.15);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
#gear:hover{box-shadow:0 4px 18px rgba(0,0,0,.25)}
#gear:active{transform:rotate(90deg) scale(.92)}

#settings{
  position:fixed;inset:0;z-index:60;
  background:rgba(0,0,0,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .35s;
  display:flex;justify-content:flex-end;
}
#settings.open{opacity:1;pointer-events:auto}
#settings .panel{
  width:min(82vw,320px);height:100%;
  background:var(--panel);border-left:1.5px solid var(--border);
  padding:max(env(safe-area-inset-top),18px) 18px 18px;
  transform:translateX(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);
  overflow-y:auto;
  backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
}
#settings.open .panel{transform:none}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.panel-head span{font-size:18px;font-weight:700;letter-spacing:.2em}
.x{border:none;background:none;color:var(--dim);font-size:22px;cursor:pointer;padding:4px;transition:color .2s}
.x:hover{color:var(--text)}
.sec{font-size:10px;letter-spacing:.25em;color:var(--dim);margin:16px 0 10px;text-transform:uppercase}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.theme-item{
  border:1.5px solid var(--border);border-radius:14px;
  padding:10px;cursor:pointer;background:var(--panel);
  text-align:center;transition:all .2s;
}
.theme-item:active{transform:scale(.96)}
.theme-item .sw{height:54px;border-radius:10px;margin-bottom:8px;border:1px solid rgba(0,0,0,.1);overflow:hidden}
.theme-item .nm{font-size:11px;color:var(--text);letter-spacing:.05em;font-weight:500}
.theme-item.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent2),0 6px 16px rgba(0,0,0,.25)}

#taskView{
  position:fixed;inset:0;z-index:40;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;background:var(--bg);cursor:pointer;text-align:center;padding:22px;
  color:var(--text);transition:background .5s,color .5s;
}
#taskName{
  font-size:clamp(28px,7.5vw,52px);font-weight:800;
  letter-spacing:.1em;line-height:1.2;
  transition:color .6s,transform .6s;
}
#taskView.done #taskName{color:var(--accent);transform:scale(1.04)}
#taskMeta{font-size:clamp(14px,4vw,22px);color:var(--dim);letter-spacing:.14em;font-weight:500}
#taskHint{font-size:12px;color:var(--dim);letter-spacing:.2em;margin-top:24px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
</style>
</head>
<body>

<button id="gear" aria-label="设置">⚙</button>

<div id="settings">
  <div class="panel">
    <div class="panel-head"><span>设 置</span><button id="closeSettings" class="x">✕</button></div>
    <div class="sec">主题风格</div>
    <div class="theme-grid" id="themeGrid"></div>
  </div>
</div>

<main id="stage">
  <h1 id="headline">今天做什么？</h1>
  <div id="wheelWrap">
    <div id="pointer"></div>
    <canvas id="wheel"></canvas>
    <div id="card" class="hidden">
      <div class="card-tag" id="cardTag">命运的决定</div>
      <div id="cardTitle"></div>
      <div id="cardActions"></div>
    </div>
    <div id="flash"><span id="flashText"></span></div>
  </div>
  <p id="hint">点击转盘开始</p>
</main>

<section id="taskView" class="hidden">
  <h2 id="taskName"></h2>
  <p id="taskMeta"></p>
  <p id="taskHint">点击文字完成</p>
</section>

<script>
(function(){
'use strict';

/* ===== 活动与时间数据 ===== */
var ACTIVITIES=[
  {name:'学习HTML',bg:null},
  {name:'看硬核知识',bg:null},
  {name:'看电影动漫解说',bg:null},
  {name:'画画',bg:['听歌','听视频','安静画']},
  {name:'数字油画手工',bg:['听歌','听视频','安静做']},
  {name:'出门溜达',bg:['听歌','听书','安静走']},
  {name:'做家务',bg:['听歌','听书','听视频','安静做']},
  {name:'出门夜跑',bg:['听歌','安静跑']},
  {name:'出门购物',bg:['听歌','安静逛']},
  {name:'和ChatGPT聊项目书',bg:null},
  {name:'找AI研究OC',bg:null},
  {name:'写小说',bg:null}
];
var TIMES=['15分钟','30分钟','45分钟','1小时','1.5小时','2小时'];

/* ===== 主题系统：外部文件动态加载 =====
   主题文件放在 themes/ 目录，每个文件一个主题，
   在 window.__THEMES__ 上注册自己。
   新增主题：新建 themes/theme-xxx.js + themes.json 加一行即可，
   无需改动本文件。 */
window.__THEMES__ = window.__THEMES__ || {};
/* 兜底主题：即使 themes.json 加载失败，至少极简黑白可用 */
window.__THEMES__.minimal = {
  name:'极简黑白',
  bg:'#fefefe',text:'#1a1a1a',dim:'rgba(26,26,26,.5)',
  panel:'rgba(255,255,255,.85)',border:'#e0e0e0',
  accent:'#2a2a2a',accent2:'#6a6a6a',
  wheel:['#000','#1a1a1a','#333','#4d4d4d','#666','#808080','#999','#b3b3b3','#ccc','#e6e6e6','#f5f5f5','#fff'],
  cardRadius:'0',btnRadius:'0',pixelated:false,
  fontFamily:'sans-serif'
};
var THEMES=window.__THEMES__;
var themeKeys=[];

/* ===== 状态 ===== */
var currentTheme='minimal',stage='idle',rotation=0,spinning=false,spinRound=0,picked=null,items=ACTIVITIES,timeSpinRound=0;
var spinResults=[];   /* 三次主转盘结果，用于三选一 */
var timeResults=[];   /* 三次时间转盘结果，用于三选一 */

function $(id){return document.getElementById(id);}
var headline=$('headline'),hint=$('hint'),wheelWrap=$('wheelWrap'),canvas=$('wheel'),pointer=$('pointer'),
    card=$('card'),cardTag=$('cardTag'),cardTitle=$('cardTitle'),cardActions=$('cardActions'),
    flash=$('flash'),flashText=$('flashText'),gear=$('gear'),settings=$('settings'),
    closeSettings=$('closeSettings'),themeGrid=$('themeGrid'),
    taskView=$('taskView'),taskName=$('taskName'),taskMeta=$('taskMeta'),taskHint=$('taskHint');

function setHeadline(t){headline.textContent=t;}
function setHint(t){hint.textContent=t;}
function showCard(){card.classList.remove('hidden');}
function hideCard(){card.classList.add('hidden');}
function showFlash(t){flashText.textContent=t;flash.classList.add('show');setTimeout(function(){flash.classList.remove('show');},1400);}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ===== 主题应用 ===== */
function applyTheme(k,save){
  var t=THEMES[k];if(!t)return;
  currentTheme=k;
  var r=document.documentElement;
  r.style.setProperty('--bg',t.bg);
  r.style.setProperty('--text',t.text);
  r.style.setProperty('--dim',t.dim);
  r.style.setProperty('--panel',t.panel);
  r.style.setProperty('--border',t.border);
  r.style.setProperty('--accent',t.accent);
  r.style.setProperty('--accent2',t.accent2);
  card.style.borderRadius=t.cardRadius;
  Array.from(document.querySelectorAll('.btn')).forEach(function(b){b.style.borderRadius=t.btnRadius;});
  document.body.style.fontFamily=t.fontFamily||'sans-serif';
  if(t.pixelated){document.body.style.imageRendering='pixelated';}
  else{document.body.style.imageRendering='auto';}
  if(save){try{localStorage.setItem('wheel-theme',k);}catch(e){}}
  updateThemeGrid();
  drawWheel();
}
function buildThemeGrid(){
  themeGrid.innerHTML='';
  themeKeys.forEach(function(k){
    var t=THEMES[k],item=document.createElement('div');
    item.className='theme-item';
    item.dataset.key=k;
    var grad='';
    if(t.wheel&&t.wheel.length>=3){
      grad='linear-gradient(135deg,'+t.wheel[0]+','+t.wheel[Math.floor(t.wheel.length/2)]+','+t.wheel[t.wheel.length-1]+')';
    }else{
      grad=t.bg;
    }
    item.innerHTML='<div class="sw" style="background:'+grad+'"></div><div class="nm">'+t.name+'</div>';
    item.addEventListener('click',function(){applyTheme(k,true);});
    themeGrid.appendChild(item);
  });
  updateThemeGrid();
}
function updateThemeGrid(){
  themeGrid.querySelectorAll('.theme-item').forEach(function(el){
    el.classList.toggle('on',el.dataset.key===currentTheme);
  });
}

/* ===== 动态加载主题文件 ===== */
function loadThemes(){
  return fetch('./themes.json')
    .then(function(res){if(!res.ok)throw 0;return res.json();})
    .then(function(data){
      var chain=Promise.resolve();
      (data.files||[]).forEach(function(f){
        chain=chain.then(function(){
          return new Promise(function(res){
            var s=document.createElement('script');
            s.src='./'+f;
            s.onload=res;
            s.onerror=res;
            document.head.appendChild(s);
          });
        });
      });
      return chain;
    })
    .catch(function(){})
    .then(function(){
      themeKeys=Object.keys(THEMES);
      buildThemeGrid();
      try{currentTheme=localStorage.getItem('wheel-theme')||'minimal';}catch(e){}
      if(!THEMES[currentTheme])currentTheme='minimal';
      applyTheme(currentTheme,false);
    });
}

/* ===== 转盘绘制 ===== */
function drawWheel(){
  var w=wheelWrap.clientWidth,dpr=window.devicePixelRatio||1;
  canvas.width=w*dpr;canvas.height=w*dpr;
  var ctx=canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var cx=w/2,cy=w/2,R=w/2-8,n=items.length,step=Math.PI*2/n,t=THEMES[currentTheme];
  ctx.clearRect(0,0,w,w);
  for(var i=0;i<n;i++){
    var s=rotation+i*step,e=s+step;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,s,e);ctx.closePath();
    ctx.fillStyle=t.wheel[i%t.wheel.length];ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.15)';ctx.lineWidth=1;ctx.stroke();
  }
  ctx.beginPath();ctx.arc(cx,cy,R*.18,0,Math.PI*2);
  ctx.fillStyle=t.panel;ctx.fill();
  ctx.strokeStyle=t.border;ctx.lineWidth=2;ctx.stroke();
}

function spinTo(targetIndex,list,onDone){
  if(spinning)return;spinning=true;
  var n=list.length,step=Math.PI*2/n,tau=Math.PI*2;
  var cur=((rotation%tau)+tau)%tau;
  var delta=(-Math.PI/2-(targetIndex+.5)*step-cur);
  delta=((delta%tau)+tau)%tau;
  var total=delta+(5+Math.random()*2)*tau;
  var start=rotation,dur=3500+Math.random()*700,t0=performance.now();
  function frame(now){
    var p=Math.min((now-t0)/dur,1),e=1-Math.pow(1-p,4);
    rotation=start+total*e;
    drawWheel();
    if(p<1)requestAnimationFrame(frame);
    else{spinning=false;onDone(targetIndex);}
  }
  requestAnimationFrame(frame);
}

/* ===== 主转盘流程 ===== */
function startMainSpin(){
  if(spinning)return;
  stage='mainSpin';items=ACTIVITIES;hideCard();
  setHeadline('命运转动中…');setHint('转盘转起来啦');
  var idx=Math.floor(Math.random()*ACTIVITIES.length);
  spinTo(idx,ACTIVITIES,function(i){
    spinRound++;
    var landed=ACTIVITIES[i];
    spinResults.push(landed);
    if(spinRound>=3)showThree();else showMainResult(landed);
  });
}
function showMainResult(a){
  stage='mainResult';var left=3-spinRound;
  setHeadline('转到啦！');setHint(left>0?'不满意可以再转 '+left+' 次':'就它了');
  cardTag.textContent='命运的决定';cardTitle.textContent=a.name;cardActions.innerHTML='';
  var ok=document.createElement('button');ok.className='btn';ok.textContent='就它了 ✓';
  ok.addEventListener('click',function(){startTimeSpin(a);});
  cardActions.appendChild(ok);
  if(left>0){
    var ag=document.createElement('button');ag.className='btn ghost';ag.textContent='再转一次（剩 '+left+' 次）';
    ag.addEventListener('click',startMainSpin);cardActions.appendChild(ag);
  }
  showCard();
}
function showThree(){
  stage='three';setHeadline('必须三选一');setHint('从三次转到的里面选一个');
  cardTag.textContent='三选一';cardTitle.textContent='三次转到的';cardActions.innerHTML='';
  shuffle(spinResults);
  spinResults.forEach(function(a){
    var b=document.createElement('button');b.className='btn ghost';b.textContent=a.name;
    b.addEventListener('click',function(){startTimeSpin(a);});cardActions.appendChild(b);
  });
  showCard();
}

/* ===== 时间转盘流程（与主转盘一致：2次重转，第3次三选一） ===== */
function startTimeSpin(a){
  picked={activity:a,time:null,bg:null};
  stage='timeSpin';items=TIMES;timeSpinRound=0;timeResults=[];hideCard();
  setHeadline('做多久？');setHint('时间交给命运');
  var idx=Math.floor(Math.random()*TIMES.length);
  spinTo(idx,TIMES,function(i){
    timeSpinRound++;
    timeResults.push(TIMES[i]);
    showTimeResult();
  });
}
function showTimeResult(){
  var left=3-timeSpinRound;
  if(timeSpinRound>=3){showTimeThree();return;}
  var cur=timeResults[timeResults.length-1];
  setHeadline('时间: '+cur);
  setHint(left>0?'不满意可以再转 '+left+' 次':'就这个了');
  cardTag.textContent='时间决定';cardTitle.textContent=cur;cardActions.innerHTML='';
  var ok=document.createElement('button');ok.className='btn';ok.textContent='就这个 ✓';
  ok.addEventListener('click',function(){
    picked.time=cur;
    hideCard();showFlash(cur);
    setTimeout(function(){
      if(picked.activity.bg&&picked.activity.bg.length)startBgSpin();else goTask();
    },1500);
  });
  cardActions.appendChild(ok);
  if(left>0){
    var ag=document.createElement('button');ag.className='btn ghost';ag.textContent='再转一次（剩 '+left+' 次）';
    ag.addEventListener('click',function(){
      hideCard();setHeadline('做多久？');setHint('时间交给命运');
      var idx=Math.floor(Math.random()*TIMES.length);
      spinTo(idx,TIMES,function(j){
        timeSpinRound++;
        timeResults.push(TIMES[j]);
        showTimeResult();
      });
    });
    cardActions.appendChild(ag);
  }
  showCard();
}
function showTimeThree(){
  stage='threeTime';setHeadline('时间三选一');setHint('从三次转到的里面选一个');
  cardTag.textContent='时间决定';cardTitle.textContent='三次转到的';cardActions.innerHTML='';
  shuffle(timeResults);
  timeResults.forEach(function(t){
    var b=document.createElement('button');b.className='btn ghost';b.textContent=t;
    b.addEventListener('click',function(){
      picked.time=t;
      hideCard();showFlash(t);
      setTimeout(function(){
        if(picked.activity.bg&&picked.activity.bg.length)startBgSpin();else goTask();
      },1500);
    });
    cardActions.appendChild(b);
  });
  showCard();
}

/* ===== 背景转盘 ===== */
function startBgSpin(){
  stage='bgSpin';hideCard();
  var opts=picked.activity.bg;items=opts;
  setHeadline('配点什么？');setHint('背景声音交给命运');
  var idx=Math.floor(Math.random()*opts.length);
  spinTo(idx,opts,function(i){
    picked.bg=opts[i];showFlash(opts[i]);setTimeout(goTask,1500);
  });
}

/* ===== 任务页 ===== */
function goTask(){
  stage='task';taskName.textContent=picked.activity.name;
  var parts=[picked.time];if(picked.bg)parts.push(picked.bg);
  taskMeta.textContent=parts.join(' · ');
  taskHint.textContent='点击文字完成';
  taskView.classList.remove('hidden');taskView.classList.remove('done');
  setHeadline('去完成吧');setHint('做完记得回来点一下');
}
function completeTask(){
  if(stage!=='task')return;stage='done';taskView.classList.add('done');
  taskHint.textContent='完成！';
  setTimeout(resetAll,1800);
}
function resetAll(){
  stage='idle';spinRound=0;timeSpinRound=0;picked=null;items=ACTIVITIES;
  spinResults=[];timeResults=[];
  taskView.classList.add('hidden');hideCard();
  setHeadline('今天做什么？');setHint('点击转盘开始');drawWheel();
}

/* ===== 事件 ===== */
canvas.addEventListener('click',function(){if(stage==='idle')startMainSpin();});
gear.addEventListener('click',function(){settings.classList.add('open');});
function closeSetting(){settings.classList.remove('open');}
closeSettings.addEventListener('click',closeSetting);
settings.addEventListener('click',function(e){if(e.target===settings)closeSetting();});
taskName.addEventListener('click',completeTask);
window.addEventListener('resize',function(){if(!spinning)drawWheel();});

/* PWA: register service worker with relative scope */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(function(){});
  });
}

/* ===== 启动：先加载主题，再初始化 ===== */
loadThemes();
})();
</script>
</body>
</html>
