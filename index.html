<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>今天做什么?</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#F7F6F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="拾碎">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
  background:var(--bg);color:var(--text);transition:background .4s,color .4s;
}
.hidden{display:none!important}

:root{
  --bg:#F7F6F2;
  --text:#1C1C1A;
  --dim:rgba(28,28,26,.45);
  --panel:rgba(252,251,248,.92);
  --border:rgba(28,28,26,.12);
  --accent:#D94E3B;
  --accent2:#2B2B28;
}

#stage{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:max(env(safe-area-inset-top),24px) 20px max(env(safe-area-inset-bottom),24px);
}

/* 顶部场景切换栏 - 优化为支持两行排列 */
.top-bar{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;margin-top:8px}
#modes{
  display: flex; flex-wrap: wrap; justify-content: center;
  background:rgba(0,0,0,.04);padding:4px;border-radius:18px;
  border:1px solid var(--border);gap:4px; max-width: 300px;
}
.mode-btn{
  border:none;background:transparent;color:var(--dim);
  padding:8px 14px;border-radius:14px;font-size:12px;font-weight:600;
  letter-spacing:.05em;cursor:pointer;transition:all .25s;
  flex: 1 1 45%; text-align: center;
}
.mode-btn.active{
  background:var(--panel);color:var(--text);
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

h1{
  font-family:"Songti SC","Noto Serif SC","STSong",serif;
  font-size:clamp(20px,5vw,28px);font-weight:700;letter-spacing:.08em;
  text-align:center;transition:all .3s;
}
#hint{font-size:12px;color:var(--dim);letter-spacing:.12em;text-align:center;min-height:18px}

/* 转盘区域 */
#wheelWrap{position:relative;width:min(78vw,340px);aspect-ratio:1;margin:auto 0}
#wheel{width:100%;height:100%;display:block;cursor:pointer;transition:transform .2s}
#wheel:active{transform:scale(.985)}

#pointer{
  position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  width:2px;height:26px;background:var(--accent);z-index:10;
  border-radius:2px;
}
#pointer::after{
  content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);
  width:7px;height:7px;border-radius:50%;background:var(--accent);
}

/* 抽卡弹窗 */
#card{
  position:absolute;inset:6%;z-index:15;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;background:var(--panel);border:1px solid var(--border);
  border-radius:20px;box-shadow:0 16px 40px rgba(0,0,0,.08);
  padding:22px 18px;animation:cardIn .35s cubic-bezier(.2,1,.3,1);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
@keyframes cardIn{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}

#cardTag{font-size:10px;letter-spacing:.2em;color:var(--dim);padding:3px 10px;border:1px solid var(--border);border-radius:99px;text-align:center;}
#cardTitle{
  font-family:"Songti SC","Noto Serif SC",serif;
  font-size:clamp(16px,4.2vw,20px);font-weight:700;text-align:center;
  color:var(--text);line-height:1.5;padding:4px 6px;
}
#cardActions{display:flex;flex-direction:column;gap:8px;width:100%;max-width:220px;margin-top:4px}

.btn{
  border:none;cursor:pointer;padding:11px 18px;
  font-size:13px;font-weight:600;letter-spacing:.06em;
  background:var(--text);color:var(--bg);border-radius:10px;
  transition:all .2s;width:100%;
}
.btn:active{transform:scale(.97)}
.btn.accent{background:var(--accent);color:#fff}
.btn.ghost{
  background:transparent;color:var(--text);
  border:1px solid var(--border);font-weight:500;
}

/* 底部碎片收集器 */
#footer{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:4px}
#dots{display:flex;gap:6px;min-height:10px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pop .3s ease-out}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
#fragText{font-size:11px;color:var(--dim);letter-spacing:.15em}

/* 右上角设置 */
#gear{
  position:fixed;top:max(env(safe-area-inset-top),14px);right:16px;z-index:50;
  width:38px;height:38px;border-radius:50%;
  border:1px solid var(--border);background:var(--panel);
  color:var(--text);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
#settings{
  position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:opacity .3s;display:flex;justify-content:flex-end;
}
#settings.open{opacity:1;pointer-events:auto}
#settings .panel{
  width:min(78vw,300px);height:100%;background:var(--bg);
  border-left:1px solid var(--border);padding:max(env(safe-area-inset-top),20px) 18px 18px;
  transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);overflow-y:auto;
}
#settings.open .panel{transform:none}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.panel-head span{font-size:15px;font-weight:700;letter-spacing:.15em}
.x{border:none;background:none;color:var(--dim);font-size:20px;cursor:pointer;padding:4px}
.sec{font-size:10px;letter-spacing:.2em;color:var(--dim);margin:16px 0 10px}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.theme-item{
  border:1px solid var(--border);border-radius:12px;padding:10px;
  cursor:pointer;background:var(--panel);text-align:center;transition:all .2s;
}
.theme-item .sw{height:44px;border-radius:8px;margin-bottom:8px;border:1px solid var(--border)}
.theme-item .nm{font-size:11px;color:var(--text);font-weight:500}
.theme-item.on{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}

/* 专注执行页 */
#taskView{
  position:fixed;inset:0;z-index:40;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;background:var(--bg);cursor:pointer;text-align:center;padding:28px;
  color:var(--text);transition:background .4s;
}
#taskTag{font-size:11px;letter-spacing:.25em;color:var(--accent);border:1px solid var(--accent);padding:4px 12px;border-radius:99px}
#taskName{
  font-family:"Songti SC","Noto Serif SC",serif;
  font-size:clamp(22px,6vw,34px);font-weight:700;
  letter-spacing:.06em;line-height:1.45;max-width:88%;
  transition:color .4s,transform .4s;
}
#taskView.done #taskName{color:var(--accent);transform:scale(1.03)}
#taskHint{font-size:12px;color:var(--dim);letter-spacing:.2em;margin-top:32px;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
</style>
</head>
<body>

<button id="gear" aria-label="设置">⚙</button>

<div id="settings">
  <div class="panel">
    <div class="panel-head"><span>外 观</span><button id="closeSettings" class="x">✕</button></div>
    <div class="sec">主题风格</div>
    <div class="theme-grid" id="themeGrid"></div>
  </div>
</div>

<main id="stage">
  <div class="top-bar">
    <div id="modes">
      <button class="mode-btn active" data-mode="quick">随地 10m</button>
      <button class="mode-btn" data-mode="dorm">宿舍 30m+</button>
      <button class="mode-btn" data-mode="library">图书馆 30m</button>
      <button class="mode-btn" data-mode="lazy">不想动</button>
    </div>
    <h1 id="headline">拾起一块碎片</h1>
    <p id="hint">轻点转盘，交给直觉</p>
  </div>

  <div id="wheelWrap">
    <div id="pointer"></div>
    <canvas id="wheel"></canvas>
    <div id="card" class="hidden">
      <div id="cardTag"></div>
      <div id="cardTitle"></div>
      <div id="cardActions"></div>
    </div>
  </div>

  <div id="footer">
    <div id="dots"></div>
    <div id="fragText">今日已拾起 0 块时间碎片</div>
  </div>
</main>

<section id="taskView" class="hidden">
  <span id="taskTag">进行中</span>
  <h2 id="taskName"></h2>
  <p id="taskHint">做完后，轻触屏幕任意处完成</p>
</section>

<script>
(function(){
'use strict';

/* ===== 场景与零门槛微任务池（深度扩充版） ===== */
var MODES = {
  quick: {
    label: '随地 10m',
    categories: [
      { name: '涂涂画画', tasks: [
        '在 iPad 或纸上画满 5 个方格的控笔排线',
        '随便挑个顺眼的局部（眼睛或手）速涂 5 分钟',
        '给构思的 OC 或者 TRPG 角色随手画个发型草图',
        '不看参考，凭感觉乱画一个小表情或小物件'
      ]},
      { name: '外语磨耳', tasks: [

        '找 AI 用英语闲聊 5 句日常，完全不管语法对错',
        '听一首全英文歌，不看歌词盲猜几句大意'
      ]},
      { name: '脑洞/OC', tasks: [
        '给你的 OC 补充一个奇怪的性格怪癖或随身小物件',
        '构思一段美式高中背景下的三人日常对话片段',
        '写下脑子里突然闪过的三句对话，不用管上下文'
      ]},
      { name: '骗自己学3分钟', tasks: [
        '翻开《建筑史》或课本，只细看一页上的插图或年代',
        '打开计算机一级，只看懂 1 个概念就允许关掉',
        '点开课程视频看满 3 分钟，时间一到随时可退'
      ]},
      { name: '数字大扫除', tasks: [
        '去手机相册里顺手删掉 10 张没用的截图或废片',
        '把备忘录里积灰的一条零碎想法整理归位',
        '清理掉浏览器里一直没关的 3 个旧标签页'
      ]},
      { name: '随手记一笔', tasks: [
        '打开 Google Tasks，列一下明天的几节课或小计划',

      ]}
    ]
  },
  library: {
    label: '图书馆 30m',
    categories: [
      { name: '外语突击', tasks: [
        '沉下心只做一篇四级阅读理解，做完立马对答案收工',
        '听一段半小时的四级听力磨耳朵，顺手做做笔记',
        '整理一下最近积累的生词本，复习前面 3 页'
      ]},
      { name: '专业课轻啃', tasks: [
        '翻开《建筑史》，不求背诵，只当课外书看懂一个章节或一张图纸',
        '把语文课或专业课的近期笔记稍微梳理排版一下',
        '心无旁骛看 25 分钟专业课，看完立刻奖励自己休息'
      ]},
      { name: '画师进阶', tasks: [
        '戴上耳机，在 iPad 上专心画半个小时的 TRPG 人物立绘或设计图',
        '找一两个画师的优秀作品，临摹研究一下他们的线条和光影',
        '花半小时补全之前画了一半搁置的草稿'
      ]},
      { name: '沉浸码字', tasks: [
        '构思一段 OC 的故事，完善一下复杂的三人角色关系推演',
        '写一段带有美式高中感的小说片段，写乱了也没关系',
        '把之前随意写在备忘录里的脑洞扩写成几百字的完整段落'
      ]},
      { name: '影音充电', tasks: [
        '找一个深度电影解析（比如《燃冬》等作品的拉片），戴耳机看半小时',
        '挑一集想看了很久的动漫，心安理得地把它看完',
        '看一个半小时左右的优质知识类或艺术类纪录片'
      ]},
      { name: '数字桌面整理', tasks: [
        '把笔记本电脑桌面上乱七八糟的文档和截图分门别类建文件夹',
        '整理一下 iPad 里画图软件的图层和文件命名',
        '规划一下本周的 Google Tasks 进度条'
      ]}
    ]
  },
  dorm: {
    label: '宿舍 30m+',
    categories: [
      { name: '十字绣/布艺', tasks: [
        '放首喜欢的歌，安安静静绣完一小块同色区域',
        '穿好线，专心推进 20 分钟不织布或十字绣',
        '整理一下绣线和布料，挑好下一次要做的颜色'
      ]},
      { name: '手工/纸艺', tasks: [
        '拿出荷兰白卡纸，剪裁折叠试着做个小手工模型或底座',
        '动手推进一段编手链，做累了随时可以收摊',
        '把手工工具和材料摊开，做好前期的打底工作'
      ]},
      { name: '手帐备料', tasks: [
        '不拼贴整页，今天只负责剪好几个手帐素材备用',
        '构思一页手帐的排版草图，或者只贴好背景打底',
        '挑几张喜欢的贴纸和纸胶带，搭配出下一期的色系'
      ]},
      { name: '宿舍微清爽', tasks: [
        '只把书桌右手边巴掌大的一块地方彻底清空擦净',
        '顺手洗掉两件小衣服，或者把水杯彻底刷干净',
        '把桌上的画具、手作工具或线团归拢进盒子里'
      ]},
      { name: '沉浸写画', tasks: [
        '边看动漫，边在 iPad 上安心练半小时控笔排线',
        '顺着之前的剧情，往下推演一段小说或人物关系',
        '随心所欲在纸上涂鸦，释放一天的压力'
      ]},
      { name: '啃一块硬骨头', tasks: [
        '挑一节最简短的 HTML、计算机或初级课看一会',
        '花 20 分钟稍微理一理项目书的思路和提纲'
      ]}
    ]
  },
  lazy: {
    label: '不想动',
    categories: [
      { name: '纯发呆/听歌', tasks: [
        '闭眼听歌，顺便想想明天早上食堂去吃茄子饼、包子还是小馄饨',
        '闭上眼睛什么都不干，完整听完两首喜欢的歌',
        '挑一首没听过的纯音乐，放空发呆 5 分钟'
      ]},
      { name: '找AI瞎聊', tasks: [
        '找我（咪咪）吐槽一下今天遇到的槽心事或无聊瞬间',
        '跟我一起脑暴一个离谱又好玩的架空设定'
      ]},
      { name: '翻看旧作品', tasks: [
        '翻翻自己以前画过的图或写过的片段，夸自己两句',
        '看看收藏夹里攒着的漂亮插画或角色设计养养眼'
      ]},
      { name: '伸展与喝水', tasks: [
        '站起来去接杯温水喝掉，顺便拉拉伸展一下肩膀',
        '离开座位站 3 分钟，转转手腕和脖子'
      ]},
      { name: '丢掉三样垃圾', tasks: [
        '环顾四周，顺手把离你最近的 3 个废纸或包装袋扔进垃圾桶',
        '把桌面上乱放的笔和本子摞整齐，一秒收工'
      ]},
      { name: '心安理得发呆', tasks: [
        '接下来 10 分钟正式批准自己什么都不学、不内耗',
        '趴着或靠着闭目养神 10 分钟，天塌下来也不管'
      ]}
    ]
  }
};

/* ===== 主题兜底与管理 ===== */
window.__THEMES__ = window.__THEMES__ || {};
window.__THEMES__.minimal = {
  name: '宣纸朱砂',
  bg: '#F7F6F2',
  text: '#1C1C1A',
  dim: 'rgba(28,28,26,.45)',
  panel: 'rgba(252,251,248,.94)',
  border: 'rgba(28,28,26,.14)',
  accent: '#D94E3B',
  accent2: '#2B2B28',
  wheel: ['#FDFCFA','#F2EFE9','#EAE6DF','#FDFCFA','#F2EFE9','#EAE6DF'],
  cardRadius: '20px',
  btnRadius: '10px'
};
var THEMES = window.__THEMES__;
var themeKeys = [];

/* ===== 状态变量 ===== */
var currentTheme = 'minimal';
var currentMode = 'quick';
var stage = 'idle';
var rotation = 0;
var spinning = false;
var spinRound = 0;
var spinResults = [];
var picked = null;

function $(id){return document.getElementById(id);}
var headline=$('headline'),hint=$('hint'),wheelWrap=$('wheelWrap'),canvas=$('wheel'),
    card=$('card'),cardTag=$('cardTag'),cardTitle=$('cardTitle'),cardActions=$('cardActions'),
    gear=$('gear'),settings=$('settings'),closeSettings=$('closeSettings'),themeGrid=$('themeGrid'),
    taskView=$('taskView'),taskName=$('taskName'),taskTag=$('taskTag'),
    dotsEl=$('dots'),fragText=$('fragText');

function getCategories(){ return MODES[currentMode].categories; }
function randomItem(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* ===== 今日碎片统计（本地持久化） ===== */
function getTodayKey(){
  var d=new Date();
  return 'frag_'+d.getFullYear()+'_'+(d.getMonth()+1)+'_'+d.getDate();
}
function getFragCount(){
  try{ return parseInt(localStorage.getItem(getTodayKey())||'0',10); }catch(e){ return 0; }
}
function addFragCount(){
  var c = getFragCount()+1;
  try{ localStorage.setItem(getTodayKey(), String(c)); }catch(e){}
  renderFrags();
}
function renderFrags(){
  var c = getFragCount();
  dotsEl.innerHTML='';
  var showDots = Math.min(c, 12);
  for(var i=0;i<showDots;i++){
    var d=document.createElement('span');
    d.className='dot';
    dotsEl.appendChild(d);
  }
  fragText.textContent = c>0 ? ('今日已拾起 '+c+' 块时间碎片') : '今日尚未拾起碎片';
}

/* ===== 主题应用 ===== */
function applyTheme(k,save){
  var t=THEMES[k];if(!t)return;
  currentTheme=k;
  var r=document.documentElement;
  r.style.setProperty('--bg',t.bg);
  r.style.setProperty('--text',t.text);
  r.style.setProperty('--dim',t.dim);
  r.style.setProperty('--panel',t.panel);
  r.style.setProperty('--border',t.border);
  r.style.setProperty('--accent',t.accent);
  r.style.setProperty('--accent2',t.accent2);
  if(save){try{localStorage.setItem('wheel-theme',k);}catch(e){}}
  updateThemeGrid();
  drawWheel();
}
function buildThemeGrid(){
  themeGrid.innerHTML='';
  themeKeys.forEach(function(k){
    var t=THEMES[k],item=document.createElement('div');
    item.className='theme-item';
    item.dataset.key=k;
    var c1 = (t.wheel&&t.wheel[0])||t.bg;
    var c2 = t.accent||t.text;
    item.innerHTML='<div class="sw" style="background:linear-gradient(135deg,'+c1+' 65%,'+c2+' 35%)"></div><div class="nm">'+t.name+'</div>';
    item.addEventListener('click',function(){applyTheme(k,true);});
    themeGrid.appendChild(item);
  });
  updateThemeGrid();
}
function updateThemeGrid(){
  themeGrid.querySelectorAll('.theme-item').forEach(function(el){
    el.classList.toggle('on',el.dataset.key===currentTheme);
  });
}
function loadThemes(){
  return fetch('./themes.json')
    .then(function(res){if(!res.ok)throw 0;return res.json();})
    .then(function(data){
      var chain=Promise.resolve();
      (data.files||[]).forEach(function(f){
        chain=chain.then(function(){
          return new Promise(function(res){
            var s=document.createElement('script');
            s.src='./'+f;s.onload=res;s.onerror=res;
            document.head.appendChild(s);
          });
        });
      });
      return chain;
    })
    .catch(function(){})
    .then(function(){
      themeKeys=Object.keys(THEMES);
      buildThemeGrid();
      try{currentTheme=localStorage.getItem('wheel-theme')||'minimal';}catch(e){}
      if(!THEMES[currentTheme])currentTheme='minimal';
      applyTheme(currentTheme,false);
    });
}

/* ===== 极简转盘绘制（带扇区文字） ===== */
function drawWheel(){
  var w=wheelWrap.clientWidth,dpr=window.devicePixelRatio||1;
  canvas.width=w*dpr;canvas.height=w*dpr;
  var ctx=canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var cx=w/2,cy=w/2,R=w/2-6;
  var cats=getCategories(),n=cats.length,step=Math.PI*2/n,t=THEMES[currentTheme];

  ctx.clearRect(0,0,w,w);

  for(var i=0;i<n;i++){
    var s=rotation+i*step,e=s+step,mid=s+step/2;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,s,e);ctx.closePath();
    ctx.fillStyle=t.wheel[i%t.wheel.length];ctx.fill();
    ctx.strokeStyle=t.border;ctx.lineWidth=1;ctx.stroke();

    /* 绘制分类文字 */
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(mid);
    ctx.textAlign='right';
    ctx.textBaseline='middle';
    ctx.fillStyle=t.text;
    ctx.font='600 '+Math.round(w*0.038)+'px -apple-system,"PingFang SC",sans-serif';
    ctx.fillText(cats[i].name, R-22, 0);
    ctx.restore();
  }

  /* 外圈细环与中心轴 */
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.strokeStyle=t.text;ctx.lineWidth=1.5;ctx.stroke();

  ctx.beginPath();ctx.arc(cx,cy,R*0.14,0,Math.PI*2);
  ctx.fillStyle=t.bg;ctx.fill();
  ctx.strokeStyle=t.text;ctx.lineWidth=1.5;ctx.stroke();

  ctx.beginPath();ctx.arc(cx,cy,3.5,0,Math.PI*2);
  ctx.fillStyle=t.accent;ctx.fill();
}

function spinTo(targetIndex,n,onDone){
  if(spinning)return;spinning=true;
  var step=Math.PI*2/n,tau=Math.PI*2;
  var cur=((rotation%tau)+tau)%tau;
  var delta=(-Math.PI/2-(targetIndex+0.5)*step-cur);
  delta=((delta%tau)+tau)%tau;
  var total=delta+(4+Math.random()*2)*tau;
  var start=rotation,dur=2600+Math.random()*500,t0=performance.now();
  function frame(now){
    var p=Math.min((now-t0)/dur,1),e=1-Math.pow(1-p,4);
    rotation=start+total*e;
    drawWheel();
    if(p<1)requestAnimationFrame(frame);
    else{spinning=false;onDone(targetIndex);}
  }
  requestAnimationFrame(frame);
}

/* ===== 转动与抽卡流程 ===== */
function startSpin(){
  if(spinning)return;
  stage='spinning';
  card.classList.add('hidden');
  headline.textContent='听凭直觉…';
  hint.textContent='看看落在哪一块';
  var cats=getCategories();
  var idx=Math.floor(Math.random()*cats.length);
  spinTo(idx,cats.length,function(i){
    spinRound++;
    var cat=cats[i];
    var microTask=randomItem(cat.tasks);
    var item={catName:cat.name, task:microTask, catObj:cat};
    spinResults.push(item);
    if(spinRound>=3) showThreeChoice();
    else showResultCard(item);
  });
}

function showResultCard(item){
  stage='result';
  var left=3-spinRound;
  headline.textContent=item.catName;
  hint.textContent=left>0?('不喜欢还可以重转 '+left+' 次'):'事不过三，就它啦';
  cardTag.textContent=MODES[currentMode].label+' · '+item.catName;
  cardTitle.textContent=item.task;
  cardActions.innerHTML='';

  var ok=document.createElement('button');
  ok.className='btn accent';
  ok.textContent='去完成这件事 →';
  ok.addEventListener('click',function(){ goTask(item); });
  cardActions.appendChild(ok);

  /* 同分类下换一个小动作（不消耗重转次数） */
  if(item.catObj && item.catObj.tasks.length>1){
    var swap=document.createElement('button');
    swap.className='btn ghost';
    swap.textContent='换个同类的微动作 ↻';
    swap.addEventListener('click',function(){
      var others=item.catObj.tasks.filter(function(t){return t!==item.task;});
      item.task=randomItem(others);
      cardTitle.textContent=item.task;
    });
    cardActions.appendChild(swap);
  }

  if(left>0){
    var ag=document.createElement('button');
    ag.className='btn ghost';
    ag.textContent='重转大方向（剩 '+left+' 次）';
    ag.addEventListener('click',startSpin);
    cardActions.appendChild(ag);
  }
  card.classList.remove('hidden');
}

function showThreeChoice(){
  stage='three';
  headline.textContent='三选一时刻';
  hint.textContent='从刚才抽到的三件事里挑一件最顺眼的';
  cardTag.textContent='直觉决断';
  cardTitle.textContent='挑一件最毫无压力的开始：';
  cardActions.innerHTML='';

  spinResults.forEach(function(r){
    var b=document.createElement('button');
    b.className='btn ghost';
    b.style.textAlign='left';
    b.style.lineHeight='1.4';
    b.innerHTML='<strong>['+r.catName+']</strong> '+r.task;
    b.addEventListener('click',function(){ goTask(r); });
    cardActions.appendChild(b);
  });
  card.classList.remove('hidden');
}

function goTask(item){
  picked=item;
  stage='task';
  card.classList.add('hidden');
  taskTag.textContent=MODES[currentMode].label+' · '+item.catName;
  taskName.textContent=item.task;
  taskView.classList.remove('hidden','done');
}

function completeTask(){
  if(stage!=='task')return;
  stage='done';
  taskView.classList.add('done');
  addFragCount();
  setTimeout(resetAll,1200);
}

function resetAll(){
  stage='idle';spinRound=0;spinResults=[];picked=null;
  taskView.classList.add('hidden');
  card.classList.add('hidden');
  headline.textContent='拾起一块碎片';
  hint.textContent='轻点转盘，交给直觉';
  drawWheel();
}

/* ===== 事件绑定 ===== */
canvas.addEventListener('click',function(){if(stage==='idle')startSpin();});
document.querySelectorAll('.mode-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    if(spinning)return;
    document.querySelectorAll('.mode-btn').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    currentMode=btn.dataset.mode;
    resetAll();
  });
});
gear.addEventListener('click',function(){settings.classList.add('open');});
function closeSetting(){settings.classList.remove('open');}
closeSettings.addEventListener('click',closeSetting);
settings.addEventListener('click',function(e){if(e.target===settings)closeSetting();});
taskView.addEventListener('click',completeTask);
window.addEventListener('resize',function(){if(!spinning)drawWheel();});

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(function(){});
  });
}

renderFrags();
loadThemes();
})();
</script>
